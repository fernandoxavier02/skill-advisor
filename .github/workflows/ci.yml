name: CI

# _Requirements: 9.1, 9.2_
# Runs `npm run validate` (test + index rebuild + smoke-runner) on every push
# and pull request, against Node 18 and Node 20. Blocks merge on red.
# No pre-commit hook is configured: TDD red commits must remain possible.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validate (test + index + smoke-runner)
        run: npm run validate
